name: Instagram Video Cloud Tracker

on:
  schedule:
    # Runs automatically in the cloud every 3 hours!
    - cron: '0 */3 * * *'
  workflow_dispatch: # Allows manual trigger anytime

permissions:
  contents: write

jobs:
  download-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install yt-dlp requests selenium

      - name: Run Instagram Monitor & Deliver Videos
        run: |
          python instagram_tracker.py

      - name: Save & Commit Seen Posts State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_instagram_posts.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Sync seen Instagram reels [skip ci]" && git push)
